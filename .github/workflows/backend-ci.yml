name: Backend CI

on:
  push:
    branches: [main, feature/**]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, audit and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: envex
          POSTGRES_PASSWORD: envex
          POSTGRES_DB: envex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U envex -d envex_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://envex:envex@localhost:5432/envex_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: uv sync --frozen

      - name: Ruff lint (includes bandit-style security rules)
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --frozen --no-hashes --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --strict

      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+asyncpg://envex:envex@localhost:5432/envex_test
          SECRET_KEY: ci-only-key-not-a-secret-but-long-enough-for-settings-validation
          FRONTEND_URL: http://localhost:5500
          COMPANY_NAME: Envex Energy
          WHATSAPP_NUMBER: "917055444005"
          CALL_NUMBER: "+917055444005"
          ALT_CALL_NUMBER: "+917055444002"
          ALERT_EMAIL: alerts@example.com
          COMPANY_ADDRESS: Clement Town, Dehradun
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Tests
        run: uv run pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            git /repo --config /repo/.gitleaks.toml --redact --exit-code 1
